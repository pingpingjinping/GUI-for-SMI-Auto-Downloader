name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install cx_Freeze "PySide6-Essentials==6.7.2" "PySide6-Addons==6.7.2" requests PyYAML beautifulsoup4 natsort tqdm certifi

      - name: Prepare runtime folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          New-Item -ItemType Directory -Force -Path log | Out-Null
          if (-not (Test-Path "log/error.log")) {
            New-Item -ItemType File -Path "log/error.log" | Out-Null
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          python setup.py build

      - name: Trim unused Qt runtime
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path build -Directory |
            Where-Object { $_.Name -like "exe.*" } |
            Select-Object -First 1

          if (-not $buildDir) {
            throw "cx_Freeze build directory was not found."
          }

          $pysideDir = Join-Path $buildDir.FullName "lib\PySide6"
          if (-not (Test-Path $pysideDir)) {
            throw "PySide6 runtime directory was not found."
          }

          # Keep the Widgets runtime plus the QtWebEngine dependencies used by the CAPTCHA browser.
          $keepRootFiles = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6OpenGL.dll",
            "Qt6Positioning.dll",
            "Qt6PrintSupport.dll",
            "Qt6Qml.dll",
            "Qt6QmlModels.dll",
            "Qt6Quick.dll",
            "Qt6QuickWidgets.dll",
            "Qt6WebChannel.dll",
            "Qt6WebEngineCore.dll",
            "Qt6WebEngineQuick.dll",
            "Qt6WebEngineWidgets.dll",
            "QtCore.pyd",
            "QtGui.pyd",
            "QtWidgets.pyd",
            "QtNetwork.pyd",
            "QtPrintSupport.pyd",
            "QtPositioning.pyd",
            "QtQml.pyd",
            "QtQmlModels.pyd",
            "QtQuick.pyd",
            "QtWebChannel.pyd",
            "QtWebEngineCore.pyd",
            "QtWebEngineWidgets.pyd",
            "QtWebEngineProcess.exe",
            "pyside6.abi3.dll",
            "__init__.pyc",
            "_cx_freeze_debug.pyc"
          )

          Get-ChildItem $pysideDir -File |
            Where-Object { $_.Name -notin $keepRootFiles } |
            Remove-Item -Force

          # QML UI modules and development extras are not used. Keep translations/resources for WebEngine.
          @("qml", "include", "typesystems", "glue", "scripts") | ForEach-Object {
            $path = Join-Path $pysideDir $_
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          # Keep only plugins needed by a regular Windows Widgets app.
          $pluginsDir = Join-Path $pysideDir "plugins"
          if (Test-Path $pluginsDir) {
            Get-ChildItem $pluginsDir -Directory |
              Where-Object { $_.Name -notin @("platforms", "imageformats", "styles", "tls", "networkinformation") } |
              Remove-Item -Recurse -Force

            $platformsDir = Join-Path $pluginsDir "platforms"
            if (Test-Path $platformsDir) {
              Get-ChildItem $platformsDir -File |
                Where-Object { $_.Name -ne "qwindows.dll" } |
                Remove-Item -Force
            }
          }

      - name: Verify QtWebEngine runtime files
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path build -Directory |
            Where-Object { $_.Name -like "exe.*" } |
            Select-Object -First 1

          $pysideDir = Join-Path $buildDir.FullName "lib\PySide6"
          $required = @(
            "QtPrintSupport.pyd",
            "Qt6PrintSupport.dll",
            "Qt6QuickWidgets.dll",
            "QtWebEngineCore.pyd",
            "QtWebEngineWidgets.pyd",
            "QtWebChannel.pyd",
            "QtNetwork.pyd",
            "QtPositioning.pyd",
            "QtQml.pyd",
            "QtQuick.pyd"
          )

          foreach ($name in $required) {
            $path = Join-Path $pysideDir $name
            if (-not (Test-Path $path)) {
              throw "Required PySide6 WebEngine runtime file is missing: $path"
            }
          }

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path build -Directory |
            Where-Object { $_.Name -like "exe.*" } |
            Select-Object -First 1
          $exePath = Join-Path $buildDir.FullName "SMI-Auto-Downloader.exe"

          $process = Start-Process -FilePath $exePath -WorkingDirectory $buildDir.FullName -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            throw "Frozen executable exited during smoke test. ExitCode=$($process.ExitCode)"
          }

          $process.Refresh()
          if ($process.MainWindowTitle -like "cx_Freeze:*") {
            $dialogText = ""
            try {
              Add-Type -AssemblyName UIAutomationClient
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $nameCondition = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::NameProperty,
                $process.MainWindowTitle
              )
              $window = $root.FindFirst(
                [System.Windows.Automation.TreeScope]::Children,
                $nameCondition
              )
              if ($window) {
                $items = $window.FindAll(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.Condition]::TrueCondition
                )
                $texts = @()
                foreach ($item in $items) {
                  $name = $item.Current.Name
                  if ($name -and $name.Trim()) {
                    $texts += $name.Trim()
                  }
                }
                $dialogText = ($texts | Select-Object -Unique) -join " | "
              }
            } catch {
              Write-Warning "Could not read cx_Freeze error dialog text: $_"
            }

            Stop-Process -Id $process.Id -Force
            throw "Frozen executable opened a cx_Freeze startup error dialog: $($process.MainWindowTitle) :: $dialogText"
          }

          Stop-Process -Id $process.Id -Force

      - name: Verify and package build
        id: package
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path build -Directory |
            Where-Object { $_.Name -like "exe.*" } |
            Select-Object -First 1

          if (-not $buildDir) {
            throw "cx_Freeze build directory was not found."
          }

          $exePath = Join-Path $buildDir.FullName "SMI-Auto-Downloader.exe"
          if (-not (Test-Path $exePath)) {
            throw "SMI-Auto-Downloader.exe was not found in $($buildDir.FullName)."
          }

          $zipPath = Join-Path $PWD "SMI-Auto-Downloader-Windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $buildDir.FullName "*") -DestinationPath $zipPath

          $buildBytes = (Get-ChildItem $buildDir.FullName -Recurse -File | Measure-Object Length -Sum).Sum
          $zipBytes = (Get-Item $zipPath).Length
          Write-Host ("Build directory size: {0:N1} MB" -f ($buildBytes / 1MB))
          Write-Host ("Release ZIP size: {0:N1} MB" -f ($zipBytes / 1MB))
          Write-Host "Largest files:"
          Get-ChildItem $buildDir.FullName -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 15 FullName, @{Name="MB"; Expression={[math]::Round($_.Length / 1MB, 1)}} |
            Format-Table -AutoSize

          "build_dir=$($buildDir.FullName)" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI-Auto-Downloader-Windows-x64
          path: ${{ steps.package.outputs.build_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.package.outputs.zip_path }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
