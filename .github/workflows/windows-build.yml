name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install cx_Freeze "PySide6-Essentials==6.7.2" requests PyYAML beautifulsoup4 natsort tqdm certifi

      - name: Prepare runtime folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          New-Item -ItemType Directory -Force -Path log | Out-Null
          if (-not (Test-Path "log/error.log")) {
            New-Item -ItemType File -Path "log/error.log" | Out-Null
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          python setup.py build

      - name: Verify and package build
        id: package
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path build -Directory |
            Where-Object { $_.Name -like "exe.*" } |
            Select-Object -First 1

          if (-not $buildDir) {
            throw "cx_Freeze build directory was not found."
          }

          $exePath = Join-Path $buildDir.FullName "SMI-Auto-Downloader.exe"
          if (-not (Test-Path $exePath)) {
            throw "SMI-Auto-Downloader.exe was not found in $($buildDir.FullName)."
          }

          $zipPath = Join-Path $PWD "SMI-Auto-Downloader-Windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $buildDir.FullName "*") -DestinationPath $zipPath

          $buildBytes = (Get-ChildItem $buildDir.FullName -Recurse -File | Measure-Object Length -Sum).Sum
          $zipBytes = (Get-Item $zipPath).Length
          Write-Host ("Build directory size: {0:N1} MB" -f ($buildBytes / 1MB))
          Write-Host ("Release ZIP size: {0:N1} MB" -f ($zipBytes / 1MB))
          Write-Host "Largest files:"
          Get-ChildItem $buildDir.FullName -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 15 FullName, @{Name="MB"; Expression={[math]::Round($_.Length / 1MB, 1)}} |
            Format-Table -AutoSize

          "build_dir=$($buildDir.FullName)" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI-Auto-Downloader-Windows-x64
          path: ${{ steps.package.outputs.build_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.package.outputs.zip_path }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
